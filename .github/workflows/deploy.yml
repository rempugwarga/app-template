name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment target
        type: choice
        required: true
        default: staging
        options: [staging, prod]

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build artefak
    uses: rempugwarga/platform-ci/.github/workflows/reusable-node-ci.yml@main
    with:
      artifact-path: dist
      artifact-name: app-build

  security:
    # Gerbang keamanan khusus deploy: deployment tidak berjalan sebelum
    # secret scanning + dependency audit hijau (selain CI di workflow CI).
    name: Security Scan
    uses: rempugwarga/platform-ci/.github/workflows/reusable-security-scan.yml@main

  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }})
    needs: [build, security]
    runs-on: ubuntu-latest
    environment: app-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist

      - name: Verifikasi artefak build
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html tidak ditemukan — artefak build tidak valid, deploy dibatalkan."
            exit 1
          fi
          echo "✔ Artefak terverifikasi: $(du -sh dist | cut -f1) di dist/"

      - name: Deploy
        run: |
          echo "Deploy artefak ke environment ${TARGET_ENV}."
          echo "TODO(owner tim aplikasi): ganti langkah ini dengan perintah deploy Anda"
          echo "(contoh: upload ke CDN, container registry, atau cluster)."
          {
            echo "## Deploy ${TARGET_ENV}"
            echo ""
            echo "- Artefak: \`app-build\` (dari run ${GITHUB_RUN_ID}, commit \`${GITHUB_SHA::12}\`)"
            echo "- Gerbang: build + typecheck + test + security scan hijau"
            echo "- Environment \`app-${TARGET_ENV}\` memiliki proteksi approval di GitHub"
            echo "  (diatur via \`platform-ci/terraform/org\`)."
          } >> "$GITHUB_STEP_SUMMARY"
