version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      platform:
        patterns:
          - '@rempugwarga/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
